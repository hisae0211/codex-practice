<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>さはらさんのとことん作業会</title>
    <style>
      :root {
        --bg-1: #fff8ed;
        --bg-2: #ffe0b6;
        --card: #ffffff;
        --accent: #ff9900;
        --accent-2: #ffb547;
        --text-main: #2a2a2a;
        --text-sub: #555;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
        background: linear-gradient(150deg, var(--bg-1), var(--bg-2));
        color: var(--text-main);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .event-card {
        width: min(860px, 100%);
        background: var(--card);
        border-radius: 28px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.13);
        overflow: hidden;
      }

      .hero {
        position: relative;
        padding: 24px;
        background:
          radial-gradient(circle at 12% 20%, #ffd99f 0 20%, transparent 21%),
          radial-gradient(circle at 88% 28%, #ffd99f 0 16%, transparent 17%),
          linear-gradient(135deg, #fff4df, #ffe6bd);
        text-align: center;
      }

      .hero img {
        width: min(100%, 340px);
        height: auto;
        border-radius: 20px;
        border: 6px solid #fff;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.16);
        background: #f8f8f8;
      }

      .badge {
        position: absolute;
        right: 20px;
        top: 20px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #fff;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 8px 12px;
        border-radius: 999px;
        letter-spacing: 0.03em;
      }

      .content {
        padding: 28px 30px 34px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2.1rem);
        line-height: 1.35;
      }

      .lead {
        margin: 10px 0 22px;
        color: var(--text-sub);
        line-height: 1.8;
      }

      .event-meta {
        display: grid;
        gap: 12px;
      }

      .meta-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }

      .meta-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: #fff3dd;
        color: #c16a00;
        display: grid;
        place-items: center;
        font-size: 1rem;
      }

      .cta {
        margin-top: 24px;
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .cta:hover {
        transform: translateY(-1px);
        filter: brightness(1.03);
      }

      @media (max-width: 480px) {
        .hero {
          padding: 18px;
        }

        .content {
          padding: 24px 20px 28px;
        }

        .badge {
          font-size: 0.75rem;
          right: 12px;
          top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="event-card">
      <section class="hero">
        <span class="badge">集中タイム開催</span>
        <img src="https://i.imgur.com/rYY5Y8z.png" alt="作業を頑張るキャラクター" />
      </section>

      <section class="content">
        <h1>さはらさんのとことん作業会</h1>
        <p class="lead">
          一緒に“とことん”進める集中作業会！
          ほどよいゆるさと、しっかり手を動かす空気感で、
          あなたのやりたいことを前に進めましょう。
        </p>

        <div class="event-meta">
          <div class="meta-item">
            <span class="meta-icon">📅</span>
            <span>開催日：2026年5月16日（土）</span>
          </div>
          <div class="meta-item">
            <span class="meta-icon">⏰</span>
            <span>開催時間：20:00〜22:30（日本時間）</span>
          </div>
        </div>

        <a class="cta" href="#" aria-label="参加申し込み">参加する</a>
      </section>
    </main>
  </body>
</html>
